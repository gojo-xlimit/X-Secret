meta:
  name: "example-xhttp-cloudrun"
  owner: "self"
  authorized: true
  notes: >
    XHTTP/SplitHTTP transport, packet-up + stream-down mode (most CDN-
    compatible). Target must implement session-based split upload/download
    matching Xray-core's splithttp server semantics: POST to <path>/<sid>/<seq>
    for upload, GET to <path>/<sid> for the download stream. See
    docs/setting-up-echo-targets.md.

target:
  host: "target.example"
  port: 443
  scheme: "https"
  sni: "target.example"
  path: "/xhttp"
  insecure_skip_verify: false

transport:
  kind: "xhttp"
  xray_protocol: ""
  ssh_server: ""

load:
  virtual_users: 60
  rate_per_second: 0
  duration_seconds: 90
  ramp_seconds: 15

payload:
  size_bytes: 1024
  file: ""

thresholds:
  p95_latency_ms: 800
  p99_latency_ms: 1600
  error_rate_max: 0.02
  min_success_handshake_rate: 0.97

output:
  dir: "results"
  formats: ["json", "summary"]
