meta:
  name: "example-http2-cloudrun"
  owner: "self"
  authorized: true
  notes: "Replace target.host before running"

target:
  host: "target.example"
  port: 443
  scheme: "https"
  sni: "target.example"
  path: "/"
  insecure_skip_verify: false

transport:
  kind: "http2"
  xray_protocol: ""
  ssh_server: ""

load:
  virtual_users: 100
  rate_per_second: 0
  duration_seconds: 60
  ramp_seconds: 10

payload:
  size_bytes: 1024
  file: ""

thresholds:
  p95_latency_ms: 500
  p99_latency_ms: 1000
  error_rate_max: 0.02
  min_success_handshake_rate: 0.98

output:
  dir: "results"
  formats: ["json", "summary"]
