meta:
  name: "example-httpupgrade-cloudrun"
  owner: "self"
  authorized: true
  notes: >
    HTTPUpgrade transport (Xray-core/Sing-box "httpupgrade") — target server
    must implement a raw byte-echo on the upgraded stream for the harness's
    throughput measurement to be meaningful. See docs/setting-up-echo-targets.md.

target:
  host: "target.example"
  port: 443
  scheme: "https"
  sni: "target.example"
  path: "/hu"
  insecure_skip_verify: false

transport:
  kind: "httpupgrade"
  xray_protocol: ""
  ssh_server: ""

load:
  virtual_users: 60
  rate_per_second: 0
  duration_seconds: 90
  ramp_seconds: 15

payload:
  size_bytes: 1024
  file: ""

thresholds:
  p95_latency_ms: 700
  p99_latency_ms: 1400
  error_rate_max: 0.02
  min_success_handshake_rate: 0.97

output:
  dir: "results"
  formats: ["json", "summary"]
