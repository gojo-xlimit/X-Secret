meta:
  name: "example-trojan-ws-cloudrun"
  owner: "self"
  authorized: true
  notes: "Requires xray-core binary in PATH; password via env STRESSLAB_XRAY_PASSWORD"

target:
  host: "target.example"
  port: 443
  scheme: "https"
  sni: "target.example"
  path: "/trojan-ws"
  insecure_skip_verify: false

transport:
  kind: "xray"
  xray_protocol: "trojan"
  ssh_server: ""

load:
  virtual_users: 30
  rate_per_second: 0
  duration_seconds: 90
  ramp_seconds: 15

payload:
  size_bytes: 2048
  file: ""

thresholds:
  p95_latency_ms: 900
  p99_latency_ms: 1800
  error_rate_max: 0.03
  min_success_handshake_rate: 0.95

output:
  dir: "results"
  formats: ["json", "summary"]
