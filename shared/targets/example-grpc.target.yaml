meta:
  name: "example-grpc-cloudrun"
  owner: "self"
  authorized: true
  notes: "Requires proto file at transport/grpc/ghz/service.proto"

target:
  host: "target.example"
  port: 443
  scheme: "grpc"
  sni: "target.example"
  path: ""
  insecure_skip_verify: false

transport:
  kind: "grpc"
  xray_protocol: ""
  ssh_server: ""

load:
  virtual_users: 50
  rate_per_second: 0
  duration_seconds: 60
  ramp_seconds: 0

payload:
  size_bytes: 256
  file: ""

thresholds:
  p95_latency_ms: 300
  p99_latency_ms: 700
  error_rate_max: 0.01
  min_success_handshake_rate: 0.99

output:
  dir: "results"
  formats: ["json", "summary"]
