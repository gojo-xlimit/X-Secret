meta:
  name: "example-ws-cloudrun"
  owner: "self"
  authorized: true
  notes: "Replace target.host before running"

target:
  host: "target.example"
  port: 443
  scheme: "wss"
  sni: "target.example"
  path: "/ws"
  insecure_skip_verify: false

transport:
  kind: "websocket"
  xray_protocol: ""
  ssh_server: ""

load:
  virtual_users: 200
  rate_per_second: 0
  duration_seconds: 120
  ramp_seconds: 20

payload:
  size_bytes: 512
  file: ""

thresholds:
  p95_latency_ms: 600
  p99_latency_ms: 1200
  error_rate_max: 0.02
  min_success_handshake_rate: 0.97

output:
  dir: "results"
  formats: ["json", "summary"]
