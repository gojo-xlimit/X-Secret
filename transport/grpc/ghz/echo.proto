// Minimal echo service used purely as a load-test target contract.
// Replace with your real service's .proto for testing actual application
// RPCs — this file exists so ghz/k6 have something runnable out of the box
// against a matching echo server on your Cloud Run lab instance.
syntax = "proto3";

package stresslab;

option go_package = "stresslab/transport/grpc/ghz";

service EchoService {
  rpc Echo (EchoRequest) returns (EchoResponse);
}

message EchoRequest {
  bytes payload = 1;
}

message EchoResponse {
  bytes payload = 1;
}
